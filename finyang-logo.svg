<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Yang Champagne Gold Metallic Gradient -->
    <linearGradient id="fy-yang-gold" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#FCF4DC"/>
      <stop offset="25%" stop-color="#F0DFAB"/>
      <stop offset="60%" stop-color="#D6B468"/>
      <stop offset="100%" stop-color="#B28B36"/>
    </linearGradient>

    <!-- Outer Beveled Gold Ring (Rotated metallic sweep) -->
    <linearGradient id="fy-ring-outer" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFF6DF"/>
      <stop offset="20%" stop-color="#E7CB85"/>
      <stop offset="45%" stop-color="#BA923C"/>
      <stop offset="75%" stop-color="#F3DD9E"/>
      <stop offset="100%" stop-color="#967020"/>
    </linearGradient>

    <!-- Navy Yin Gradient -->
    <linearGradient id="fy-yin-navy" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#182850"/>
      <stop offset="40%" stop-color="#0C152B"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <!-- Blue Glow on Yin Left Flank -->
    <radialGradient id="fy-yin-glow" cx="22%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#2B5FE8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1A3D9E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0C152B" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Blue Sphere (Eye) -->
    <radialGradient id="fy-blue-eye" cx="35%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#9BC0FF"/>
      <stop offset="28%" stop-color="#4B7FFF"/>
      <stop offset="70%" stop-color="#224ED4"/>
      <stop offset="100%" stop-color="#0C2166"/>
    </radialGradient>

    <!-- 3D Gold Bar Front Face -->
    <linearGradient id="fy-gold-bar-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9ECBE"/>
      <stop offset="35%" stop-color="#DEBA63"/>
      <stop offset="100%" stop-color="#A37725"/>
    </linearGradient>

    <!-- 3D Gold Bar Side Bevel -->
    <linearGradient id="fy-gold-bar-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#926B1E"/>
      <stop offset="100%" stop-color="#5E420F"/>
    </linearGradient>

    <!-- 3D Blue Bar Front Face -->
    <linearGradient id="fy-blue-bar-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E9BFF"/>
      <stop offset="25%" stop-color="#3B6CF4"/>
      <stop offset="70%" stop-color="#1D41B2"/>
      <stop offset="100%" stop-color="#0E2263"/>
    </linearGradient>

    <!-- Clips -->
    <clipPath id="fy-clip-disc">
      <circle cx="250" cy="250" r="221"/>
    </clipPath>

    <!-- Yang Swirl Clip Path: rotated -18 deg -->
    <clipPath id="fy-clip-yang">
      <path d="M 250 29 A 221 221 0 0 1 250 471 A 110.5 110.5 0 0 0 250 250 A 110.5 110.5 0 0 1 250 29 Z" transform="rotate(-18 250 250)"/>
    </clipPath>

    <!-- Yin Swirl Clip Path -->
    <clipPath id="fy-clip-yin">
      <path d="M 250 29 A 221 221 0 0 0 250 471 A 110.5 110.5 0 0 0 250 250 A 110.5 110.5 0 0 1 250 29 Z" transform="rotate(-18 250 250)"/>
    </clipPath>
  </defs>

  <!-- 1. Outer Metallic Beveled Gold Ring -->
  <circle cx="250" cy="250" r="231" fill="none" stroke="url(#fy-ring-outer)" stroke-width="18"/>
  <!-- Outer Rim Fine Highlight -->
  <circle cx="250" cy="250" r="239.5" fill="none" stroke="#FFF1CE" stroke-width="1.5" opacity="0.9"/>
  <!-- Inner Ring Shadow / Inset Groove -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="#3D2A08" stroke-width="2.5"/>

  <!-- 2. Inside the Disc -->
  <g clip-path="url(#fy-clip-disc)">
    <!-- Base Yin Navy Field with Left Flank Blue Glow -->
    <circle cx="250" cy="250" r="221" fill="url(#fy-yin-navy)"/>
    <circle cx="250" cy="250" r="221" fill="url(#fy-yin-glow)"/>

    <!-- 5 Blue Bars (Clipped to Yin field, flat tops, 3D beveled) -->
    <g clip-path="url(#fy-clip-yin)">
      <!-- Bar 1 (tallest: x=94..116, top_y=306) -->
      <g>
        <rect x="94" y="306" width="17" height="140" fill="url(#fy-blue-bar-face)"/>
        <rect x="94" y="306" width="22" height="3.5" fill="#B9D4FF"/>
        <rect x="111" y="309.5" width="5" height="136.5" fill="#0A1742"/>
      </g>
      <!-- Bar 2 (x=122..144, top_y=328) -->
      <g>
        <rect x="122" y="328" width="17" height="130" fill="url(#fy-blue-bar-face)"/>
        <rect x="122" y="328" width="22" height="3.5" fill="#B9D4FF"/>
        <rect x="139" y="331.5" width="5" height="126.5" fill="#0A1742"/>
      </g>
      <!-- Bar 3 (x=150..172, top_y=350) -->
      <g>
        <rect x="150" y="350" width="17" height="120" fill="url(#fy-blue-bar-face)"/>
        <rect x="150" y="350" width="22" height="3.5" fill="#B9D4FF"/>
        <rect x="167" y="353.5" width="5" height="116.5" fill="#0A1742"/>
      </g>
      <!-- Bar 4 (x=178..200, top_y=372) -->
      <g>
        <rect x="178" y="372" width="17" height="110" fill="url(#fy-blue-bar-face)"/>
        <rect x="178" y="372" width="22" height="3.5" fill="#B9D4FF"/>
        <rect x="195" y="375.5" width="5" height="106.5" fill="#0A1742"/>
      </g>
      <!-- Bar 5 (x=206..228, top_y=394) -->
      <g>
        <rect x="206" y="394" width="17" height="90" fill="url(#fy-blue-bar-face)"/>
        <rect x="206" y="394" width="22" height="3.5" fill="#B9D4FF"/>
        <rect x="223" y="397.5" width="5" height="86.5" fill="#0A1742"/>
      </g>
    </g>

    <!-- 3. Yang Swirl Field (Champagne gold) -->
    <path d="M 250 29 A 221 221 0 0 1 250 471 A 110.5 110.5 0 0 0 250 250 A 110.5 110.5 0 0 1 250 29 Z"
          transform="rotate(-18 250 250)" fill="url(#fy-yang-gold)"/>

    <!-- 4. 4 3D Gold Bars (Clipped to Yang field, flat tops, beveled) -->
    <g clip-path="url(#fy-clip-yang)">
      <!-- Bar 1 (shortest: x=300..322, top_y=208) -->
      <g>
        <rect x="300" y="208" width="17" height="120" fill="url(#fy-gold-bar-face)"/>
        <rect x="300" y="208" width="22" height="3.5" fill="#FFF9E8"/>
        <rect x="317" y="211.5" width="5" height="116.5" fill="url(#fy-gold-bar-side)"/>
      </g>
      <!-- Bar 2 (x=328..350, top_y=184) -->
      <g>
        <rect x="328" y="184" width="17" height="160" fill="url(#fy-gold-bar-face)"/>
        <rect x="328" y="184" width="22" height="3.5" fill="#FFF9E8"/>
        <rect x="345" y="187.5" width="5" height="156.5" fill="url(#fy-gold-bar-side)"/>
      </g>
      <!-- Bar 3 (x=356..378, top_y=158) -->
      <g>
        <rect x="356" y="158" width="17" height="200" fill="url(#fy-gold-bar-face)"/>
        <rect x="356" y="158" width="22" height="3.5" fill="#FFF9E8"/>
        <rect x="373" y="161.5" width="5" height="196.5" fill="url(#fy-gold-bar-side)"/>
      </g>
      <!-- Bar 4 (tallest: x=384..406, top_y=130) -->
      <g>
        <rect x="384" y="130" width="17" height="290" fill="url(#fy-gold-bar-face)"/>
        <rect x="384" y="130" width="22" height="3.5" fill="#FFF9E8"/>
        <rect x="401" y="133.5" width="5" height="286.5" fill="url(#fy-gold-bar-side)"/>
      </g>
    </g>

    <!-- 5. The Two Eyes (rotated -18 deg) -->
    <g transform="rotate(-18 250 250)">
      <!-- Top Eye: Dark Pit with Gold Beveled Rim -->
      <circle cx="250" cy="139.5" r="30" fill="none" stroke="#8B681D" stroke-width="4.5"/>
      <circle cx="250" cy="139.5" r="28.5" fill="none" stroke="#EDD494" stroke-width="2"/>
      <circle cx="250" cy="139.5" r="25" fill="#080E1E"/>

      <!-- Bottom Eye: 3D Glossy Blue Sphere -->
      <circle cx="250" cy="360.5" r="26" fill="url(#fy-blue-eye)"/>
      <!-- Specular Reflection Highlight -->
      <ellipse cx="244" cy="354" rx="6" ry="4" fill="#D9E8FF" opacity="0.55" transform="rotate(-25 244 354)"/>
    </g>
  </g>
</svg>